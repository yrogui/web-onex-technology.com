name: Deploy to EX2 (cPanel)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-ex2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and export static site
        run: npm run build

      - name: Validate out/ exists
        run: |
          test -d out
          test -f out/index.html

      - name: Add EX2 server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.EX2_PORT }} ${{ secrets.EX2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy out/ to EX2 via rsync over SSH
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete
          path: out/
          remote_path: ${{ secrets.EX2_PATH }}/
          remote_host: ${{ secrets.EX2_HOST }}
          remote_user: ${{ secrets.EX2_USER }}
          remote_port: ${{ secrets.EX2_PORT }}
          remote_key: ${{ secrets.EX2_SSH_KEY }}
