name: Deploy to EX2 (cPanel)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-ex2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate out/ exists
        run: |
          test -d out
          test -f out/index.html

      - name: Deploy to EX2 via scp
        run: |
          echo "${{ secrets.EX2_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.EX2_PORT }} -i /tmp/deploy_key ${{ secrets.EX2_USER }}@${{ secrets.EX2_HOST }} "cd ${{ secrets.EX2_PATH }} && rm -rf _next _not-found 404 404.html index.html index.txt blog mentions-legales politique-cookies politique-de-confidentialite assets __next.* *.txt"
          scp -o StrictHostKeyChecking=no -P ${{ secrets.EX2_PORT }} -i /tmp/deploy_key -r out/* ${{ secrets.EX2_USER }}@${{ secrets.EX2_HOST }}:${{ secrets.EX2_PATH }}/
          rm -f /tmp/deploy_key
