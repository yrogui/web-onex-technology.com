name: Deploy to EX2 (cPanel)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-ex2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_N8N_CHECKLIST_WEBHOOK: ${{ secrets.NEXT_PUBLIC_N8N_CHECKLIST_WEBHOOK }}
          NEXT_PUBLIC_N8N_CHECKLIST_CONFIRM_WEBHOOK: ${{ secrets.NEXT_PUBLIC_N8N_CHECKLIST_CONFIRM_WEBHOOK }}
          NEXT_PUBLIC_CHECKLIST_PDF_URL: ${{ secrets.NEXT_PUBLIC_CHECKLIST_PDF_URL }}
          NEXT_PUBLIC_N8N_CHAT_WEBHOOK: ${{ secrets.NEXT_PUBLIC_N8N_CHAT_WEBHOOK }}
          NEXT_PUBLIC_CHAT_ENABLED: ${{ secrets.NEXT_PUBLIC_CHAT_ENABLED }}
        run: npm run build

      - name: Validate out/ exists
        run: |
          test -d out
          test -f out/index.html

      - name: Deploy to EX2 via scp
        env:
          EX2_HOST: ${{ secrets.EX2_HOST }}
          EX2_PORT: ${{ secrets.EX2_PORT }}
          EX2_USER: ${{ secrets.EX2_USER }}
          EX2_PATH: ${{ secrets.EX2_PATH }}
          EX2_SSH_KEY: ${{ secrets.EX2_SSH_KEY }}
        run: |
          set -euo pipefail
          echo "$EX2_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          trap 'rm -f /tmp/deploy_key' EXIT

          # Options SSH communes : accept-new (moins risqué que =no), timeouts, keepalive.
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i /tmp/deploy_key -p $EX2_PORT"
          SCP_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i /tmp/deploy_key -P $EX2_PORT"

          # Retry générique : 3 tentatives, backoff 10s/20s.
          retry() {
            local n=1 max=3 delay=10
            until "$@"; do
              if [ $n -ge $max ]; then
                echo "::error::Échec après $max tentatives : $*"
                return 1
              fi
              echo "Tentative $n/$max échouée, nouvel essai dans ${delay}s…"
              sleep $delay; n=$((n+1)); delay=$((delay*2))
            done
          }

          # Preflight : vérifie la connectivité AVANT de toucher au serveur.
          if ! retry ssh $SSH_OPTS "$EX2_USER@$EX2_HOST" "echo ok" >/dev/null; then
            echo "::error::Impossible de joindre $EX2_HOST:$EX2_PORT (timeout). Vérifier : secrets EX2_HOST/EX2_PORT, serveur up, et firewall cPanel/CSF autorisant l'IP du runner GitHub."
            exit 1
          fi

          # Nettoyage ciblé (préserve .htaccess, cgi-bin, etc.).
          retry ssh $SSH_OPTS "$EX2_USER@$EX2_HOST" "cd '$EX2_PATH' && rm -rf _next _not-found 404 404.html index.html index.txt blog mentions-legales politique-cookies politique-de-confidentialite assets __next.* *.txt confirmer-inscription merci-checklist perspectives"

          # Upload.
          retry scp $SCP_OPTS -r out/* "$EX2_USER@$EX2_HOST:$EX2_PATH/"
